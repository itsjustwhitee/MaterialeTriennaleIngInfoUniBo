---
- name: Ensure cron is installed
  ansible.builtin.apt:
    name: cron
    state: present
    update_cache: true

- name: Setup cron
  ansible.builtin.cron:
    name: "availability.sh"
    minute: "1-59/2"
    hour: "6-23"
    # day: "*"
    # month: "*"
    # weekday: "*"
    user: "root"
    job: "/usr/bin/availability.sh"
