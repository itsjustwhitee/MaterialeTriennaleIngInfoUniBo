interface=eth1
interface=eth2 # se serve su più interfacce, poi si devono taggare le direttive come da esempi seguenti

# nota: il range è lo spazio di indirizzi allocabili,
# ma anche se più ridotto fa parte comunque della subnet
dhcp-range=eth1,172.21.21.129,172.21.21.254,255.255.255.128,12h
dhcp-range=eth2,172.22.22.193,172.22.22.254,255.255.255.192,12h

dhcp-option=3
dhcp-option=121,172.21.21.128/25,172.22.22.1,172.22.22.192/26,172.21.21.1